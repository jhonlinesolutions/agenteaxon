
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Axon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<!-- Redirecionamento automático após 6 segundos -->
<meta http-equiv="refresh" content="6;url=/">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0D1B2A;
    color: #F4F7FA;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Orbs de fundo */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(90px); pointer-events: none; z-index: 0;
  }
  .orb-1 { width: 500px; height: 500px; background: rgba(123,47,190,0.25); top: -150px; right: -100px; }
  .orb-2 { width: 350px; height: 350px; background: rgba(0,229,255,0.15); bottom: -100px; left: -80px; }

  .container {
    position: relative; z-index: 1;
    text-align: center;
    padding: 40px 28px;
    max-width: 560px;
  }

  /* Logo */
  .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 48px;
    text-decoration: none;
  }
  .logo-wrap img { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; }
  .logo-text {
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 1.6rem; letter-spacing: 0.08em;
    background: linear-gradient(135deg, #00E5FF, #7B2FBE);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* 404 */
  .error-code {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(6rem, 20vw, 9rem);
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #7B2FBE, #00E5FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #F4F7FA;
    margin-bottom: 16px;
  }

  p {
    font-size: 1rem;
    color: rgba(244,247,250,0.6);
    line-height: 1.7;
    margin-bottom: 40px;
  }

  /* Countdown */
  .countdown-wrap {
    margin-bottom: 32px;
    font-size: 0.85rem;
    color: rgba(244,247,250,0.4);
    font-family: 'DM Sans', monospace;
  }
  .countdown-num {
    color: #00E5FF;
    font-weight: 600;
    font-size: 1rem;
  }

  /* Barra de progresso */
  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(244,247,250,0.08);
    border-radius: 3px;
    margin-bottom: 32px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7B2FBE, #00E5FF);
    border-radius: 3px;
    animation: progress 6s linear forwards;
  }
  @keyframes progress {
    from { width: 0%; }
    to   { width: 100%; }
  }

  /* Botões */
  .btn-primary {
    display: inline-block;
    background: #7B2FBE; color: #fff;
    font-family: 'DM Sans', sans-serif; font-weight: 700;
    font-size: 1rem; padding: 14px 32px;
    border-radius: 8px; text-decoration: none;
    transition: all 0.25s; margin: 0 8px 12px;
  }
  .btn-primary:hover { background: #9B4FDE; box-shadow: 0 8px 32px rgba(123,47,190,0.4); transform: translateY(-2px); }

  .btn-ghost {
    display: inline-block;
    color: rgba(244,247,250,0.65);
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    font-size: 0.95rem; padding: 14px 24px;
    border-radius: 8px; text-decoration: none;
    border: 1px solid rgba(244,247,250,0.15);
    transition: all 0.25s; margin: 0 8px 12px;
  }
  .btn-ghost:hover { color: #F4F7FA; border-color: rgba(244,247,250,0.35); }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,0.3), transparent);
    margin: 40px 0 32px;
  }

  .links {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    font-size: 0.85rem;
  }
  .links a {
    color: #00E5FF; text-decoration: none;
    padding: 4px 12px; border-radius: 100px;
    border: 1px solid rgba(0,229,255,0.2);
    transition: all 0.2s;
  }
  .links a:hover { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.4); }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">

  <!-- Logo -->
  <a href="/" class="logo-wrap">
    <img src="/axon-logo.webp" alt="Axon logo">
    <span class="logo-text">Axon</span>
  </a>

  <!-- Erro -->
  <div class="error-code">404</div>
  <h1>Página não encontrada</h1>
  <p>A URL que você tentou acessar não existe ou foi movida.<br>Vamos te levar de volta ao início automaticamente.</p>

  <!-- Countdown -->
  <div class="countdown-wrap">
    Redirecionando em <span class="countdown-num" id="count">6</span> segundos...
  </div>

  <!-- Barra de progresso -->
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

  <!-- Botões -->
  <div>
    <a href="/" class="btn-primary">← Ir para o início agora</a>
    <a href="/contato/" class="btn-ghost">Falar com a equipe</a>
  </div>

  <div class="divider"></div>

  <!-- Links rápidos -->
  <div class="links">
    <a href="/sobre/">Sobre</a>
    <a href="/blog/">Blog</a>
    <a href="/contato/">Contato</a>
    <a href="/blog/por-que-seu-chatbot-esta-perdendo-vendas/">Artigos</a>
  </div>

</div>

<script>
  // Countdown
  let count = 6;
  const el = document.getElementById('count');
  const timer = setInterval(() => {
    count--;
    el.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      window.location.href = '/';
    }
  }, 1000);
</script>
</body>
</html>
