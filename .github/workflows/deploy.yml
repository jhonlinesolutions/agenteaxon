name: Deploy

# Push no main publica o site: testes → Cloudflare Pages → limpeza do cache da zona.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 554d1c91e69940946e9aaa9c942f399f
  CLOUDFLARE_ZONE_ID: a54c6a91517b553b3437bd43e2a90a0d

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes (build + vitest)
        run: npm test

      - name: Publicar na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name agenteaxon --branch main --commit-hash "$GITHUB_SHA"

      - name: Limpar cache do agenteaxon.com.br
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true'

      - name: Conferir URLs no domínio
        run: |
          sleep 10
          node --experimental-strip-types scripts/check-urls.mjs https://agenteaxon.com.br
